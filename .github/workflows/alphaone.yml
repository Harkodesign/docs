name: ALPHAONE hourly AI briefing

on:
  schedule:
    # Every hour at :07 (GitHub's scheduler is busiest at :00).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: research and render, but don't send email"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alphaone
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: alphaone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alphaone/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore ALPHAONE's memory
        uses: actions/cache/restore@v4
        with:
          path: alphaone/.state
          key: alphaone-state-${{ github.run_id }}
          restore-keys: alphaone-state-

      - name: Run ALPHAONE
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALPHAONE_TO: ${{ vars.ALPHAONE_TO }}
          ALPHAONE_MODEL: ${{ vars.ALPHAONE_MODEL }}
          ALPHAONE_EFFORT: ${{ vars.ALPHAONE_EFFORT }}
          ALPHAONE_TIMEZONE: ${{ vars.ALPHAONE_TIMEZONE }}
          ALPHAONE_SKIP_QUIET: ${{ vars.ALPHAONE_SKIP_QUIET }}
          ALPHAONE_MAX_SEARCHES: ${{ vars.ALPHAONE_MAX_SEARCHES }}
          ALPHAONE_MAX_FETCHES: ${{ vars.ALPHAONE_MAX_FETCHES }}
        run: python main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save ALPHAONE's memory
        if: success() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: alphaone/.state
          key: alphaone-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep a copy of this issue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphaone-issue-${{ github.run_id }}-${{ github.run_attempt }}
          path: alphaone/out/
          retention-days: 7
          if-no-files-found: ignore
